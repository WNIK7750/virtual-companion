[project]
name = "virtual-companion"
version = "0.1.0.dev0"
description = "Natural conversation, character identity, and memory"
license = "MIT"
requires-python = "==3.13.*"
dependencies = [
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "pydantic==2.13.4",
    "readability-lxml==0.8.4.1",
    "lxml==6.1.3",
    "lxml-html-clean==0.4.5",
    "cssselect==1.6.0",
    "chardet==7.6.0",
]

[project.optional-dependencies]
provider = ["tokenizers==0.23.2"]
semantic = ["fastembed==0.9.0"]
web = ["tavily-python==0.8.5"]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.5",
  "zstandard==0.25.0",
]

[tool.uv]
required-version = "==0.12.9"
package = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]
